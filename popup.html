<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Viora AI</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div class="brand-wrap">
          <div class="brand-mark">V</div>
          <div class="brand-copy">
            <h1>Viora</h1>
            <span>AI Extension</span>
          </div>
        </div>
      </header>

      <main class="content">
        <section class="feature-grid">
          <button class="feature-btn active" data-mode="chat">Chat</button>
          <button class="feature-btn" data-mode="code">Code</button>
          <button class="feature-btn" data-mode="image">Image</button>
        </section>

        <label class="field-label" for="promptInput">Your prompt</label>
        <textarea id="promptInput" rows="6" placeholder="Ask Viora to write code, explain logic, generate ideas, or create a prompt..."></textarea>

        <div class="action-row">
          <button id="generateBtn" class="primary-btn">Generate</button>
          <button id="clearBtn" class="secondary-btn">Clear</button>
        </div>

        <div class="output-card">
          <h2>Response</h2>
          <p id="responseOutput">Ready for your next AI workflow.</p>
        </div>
      </main>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
